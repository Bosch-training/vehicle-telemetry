name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        working-directory: build
        run: ctest --output-on-failure

  lint:
    name: Lint (clang-format & clang-tidy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy

      - name: Check formatting
        run: |
          find src tests -name '*.cpp' -o -name '*.h' \
            | xargs clang-format --dry-run --Werror

      - name: Configure for clang-tidy
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: |
          find src -name '*.cpp' \
            | xargs clang-tidy -p build --warnings-as-errors='*'

  deploy:
    name: Deploy (EC2 timestamp)
    runs-on: ubuntu-latest
    needs: [build-and-test, lint]
    # Only deploy from a real push/manual run on main, never from a PR.
    if: >
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    steps:
      - name: Write SSH key and known hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Update timestamp file on instance
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          TARGET_FILE: /home/ubuntu/deploy-timestamp.txt
        run: |
          set -euo pipefail
          TIMESTAMP="$(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S %Z')"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            "$EC2_USER@$EC2_HOST" \
            "printf '%s\n' '$TIMESTAMP' > '$TARGET_FILE'"
          echo "Wrote IST timestamp '$TIMESTAMP' to $TARGET_FILE on $EC2_HOST"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
