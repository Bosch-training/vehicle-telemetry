name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        working-directory: build
        run: ctest --output-on-failure

  # Lint disabled; re-enable by uncommenting and adding `lint` back to deploy needs.
  # lint:
  #   name: Lint (clang-format & clang-tidy)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4
  #
  #     - name: Install clang tooling
  #       run: |
  #         sudo apt-get update
  #         sudo apt-get install -y clang-format clang-tidy
  #
  #     - name: Check formatting
  #       run: |
  #         find src tests -name '*.cpp' -o -name '*.h' \
  #           | xargs clang-format --dry-run --Werror
  #
